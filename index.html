        let audioCtx = null;
        const playSfx = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return; 

                if (!audioCtx) { audioCtx = new AudioContext(); }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    // Ceria / Ting!
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); 
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'incorrect') {
                    // Boing
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(300, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3); 
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'click') {
                    // Pop / Bubble
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05); 
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.05);
                }
            } catch (err) {
                console.warn("Efek suara tidak didukung.", err);
            }
        };

                        </div>
                    </div>
                </div>
            );
        }

        function EndScreen({ userData, correctCount, onRestart, playerName, playerSchool }) {
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState("idle"); 

            const handleSaveToGoogleSheets = async () => {
                if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("MASUKKAN_URL")) return setSaveStatus("error");
                setIsSaving(true);
                
                // Mapping key dipertahankan persis sama agar kompatibel dengan spreadsheet yang sudah ada
                const payload = {
                    nama: playerName, sekolah: playerSchool, skor: correctCount, benar: correctCount,
                    ref1: "-", ref2: "-", ref3: "-", ref4: "-",
                    papua_masalah: userData.final_project?.pemahaman || "-",
                    papua_solusi: userData.final_project?.strategi || "-",
                    papua_kampanye: userData.final_project ? `Janji Bintang: ${userData.final_project.aksi} | Bintang Rating: ${userData.final_project.rating}` : "-",
                };
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    setSaveStatus("success");
                } catch (error) { setSaveStatus("error"); } finally { setIsSaving(false); }
            };

            return (
                <div className="flex flex-col items-center justify-center gap-8 xl:gap-12 animate-fade-in w-full flex-1 min-h-0 overflow-y-auto pb-10 pt-5">
                  <div className="text-center bg-white/95 p-8 md:p-12 xl:p-16 rounded-[4rem] shadow-2xl w-full max-w-3xl xl:max-w-5xl border-8 border-amber-300 mt-8 backdrop-blur-md relative overflow-hidden">
                    <div className="absolute top-0 right-0 text-9xl opacity-10 -mr-4 -mt-4 transform rotate-12">🎪</div>
                    <div className="absolute bottom-0 left-0 text-9xl opacity-10 -ml-4 -mb-4 transform -rotate-12">🎈</div>
                    
                    <div className="bg-amber-50 p-2 inline-block rounded-full border-4 border-white shadow-md mb-8 relative z-10 overflow-hidden">
                        <img src={LOGO_IMAGE_URL} alt="Logo" className="w-32 h-32 md:w-40 md:h-40 xl:w-56 xl:h-56 object-cover animate-bounce-slow rounded-full" />
                    </div>
                    <h2 className="text-5xl md:text-7xl xl:text-9xl font-black text-amber-500 tracking-wide relative z-10 text-outline">YAYYY Selesai!</h2>
                    <p className="text-2xl md:text-4xl xl:text-6xl font-black mt-6 xl:mt-8 text-slate-700 relative z-10">Hai {playerName}, <br/><span className="text-pink-500 block mt-3 text-3xl md:text-5xl xl:text-7xl">Kamu Penjelajah Bahasa Hebat!</span></p>
                    <div className="text-2xl md:text-3xl xl:text-5xl font-black text-slate-500 mt-10 xl:mt-14 bg-slate-50 p-8 rounded-[3rem] border-4 border-slate-200 shadow-inner relative z-10">
                        Total Tiket Bintang <br/><span className="text-7xl md:text-8xl xl:text-[10rem] text-yellow-400 inline-block mt-6 mb-4 drop-shadow-xl text-outline">{correctCount}</span><span className="text-5xl xl:text-7xl text-slate-400">/21</span>
                    </div>
                  </div>

                  <div className="w-full max-w-3xl xl:max-w-5xl bg-white p-8 md:p-12 xl:p-16 rounded-[4rem] shadow-2xl border-4 border-amber-300 relative text-base">
                    <div className="text-center border-b-4 border-amber-100 pb-6 xl:pb-8 mb-6 xl:mb-8 bg-amber-50 rounded-[2rem] p-6">
                      <h3 className="font-black text-3xl md:text-5xl xl:text-6xl text-amber-600 tracking-wide text-outline">Papan Nama Bintang</h3>
                      <p className="text-amber-700 font-bold text-xl md:text-3xl xl:text-4xl mt-3 xl:mt-5 bg-white inline-block px-8 py-3 rounded-full border-4 border-amber-200 shadow-sm">{playerName} - {playerSchool}</p>
                    </div>
                    <div className="space-y-4 xl:space-y-6 max-h-56 xl:max-h-96 overflow-y-auto pr-4 custom-scrollbar text-base md:text-xl xl:text-3xl">
                      <div className="bg-sky-50 p-6 xl:p-10 rounded-[3rem] border-4 border-sky-200 shadow-sm text-slate-700 font-bold leading-relaxed">
                          <span className="text-sky-600 block mb-3 xl:mb-5 font-black text-sm md:text-lg xl:text-2xl border-b-2 border-sky-200 pb-2">Janji Bintangmu:</span> 
                          "{userData.ref5 || '-'}"
                      </div>
                    </div>
                  </div>

                  <div className="w-full max-w-3xl xl:max-w-5xl space-y-5 xl:space-y-8 mt-6">
                    {saveStatus === 'idle' && <button onClick={handleSaveToGoogleSheets} disabled={isSaving} className="bg-gradient-to-b from-emerald-400 to-emerald-500 hover:from-emerald-300 hover:to-emerald-400 text-white font-black w-full py-6 xl:py-8 rounded-full flex items-center justify-center gap-4 text-xl md:text-3xl xl:text-4xl shadow-[0_6px_0_#047857] active:shadow-none active:translate-y-2 transition-all border-4 border-white">{isSaving ? "Menyimpan Catatan..." : <><Icons.Save className="w-8 h-8 xl:w-12 xl:h-12"/> Simpan Catatan Petualangan</>}</button>}
                    {saveStatus === 'success' && <div className="bg-emerald-50 text-emerald-600 p-6 xl:p-8 rounded-[3rem] text-center font-black text-2xl xl:text-4xl border-4 border-emerald-300 shadow-sm">Catatan berhasil disimpan! ✅</div>}
                    {saveStatus === 'error' && <div className="bg-rose-50 text-rose-600 p-6 xl:p-8 rounded-[3rem] text-center font-black text-2xl xl:text-4xl border-4 border-rose-300 shadow-sm">Gagal menyimpan. <button onClick={()=>setSaveStatus('idle')} className="underline text-rose-800 ml-3 hover:text-rose-500 transition-colors">Coba Lagi</button></div>}
                    <button onClick={onRestart} className="bg-slate-200 hover:bg-slate-300 text-slate-600 font-black w-full py-6 xl:py-8 rounded-full flex items-center justify-center gap-4 text-xl md:text-3xl xl:text-4xl shadow-[0_6px_0_#94a3b8] active:shadow-none active:translate-y-2 transition-all border-4 border-white"><Icons.RefreshCcw className="w-8 h-8 xl:w-12 xl:h-12"/> Pulang dari Taman (Ulang)</button>
                  </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PetualanganBhinneka />);
    </script>
</body>
</html>
